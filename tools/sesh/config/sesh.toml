# See: https://github.com/joshmedeski/sesh?tab=readme-ov-file#session-configuration

# Ban specific sessions from appearing in the menu
blacklist = []

# Default behavior when creating any session (can be overridden per session below)
[default_session]
  preview_command = "eza --all --git --icons --color=always {}"

# Configure common sessions — add your own below.
# Pattern: name + path. Optionally startup_command.

[[session]]
  name = "dotfiles"
  path = "~/Projects/macos-dev-setup"
